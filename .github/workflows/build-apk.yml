
name: KESHAN SENSITIVE APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova@13

      - name: Create Android Project
        run: |
          cordova create app com.keshan.sensitive "KESHAN SENSITIVE"
          cd app
          cordova platform add android@13.0.0

      - name: Copy Website Files
        run: |
          cp index.html app/www/index.html
          cp style.css app/www/style.css
          cp script.js app/www/script.js

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESHAN-SENSITIVE-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
